<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <!-- Zoho SDK -->
    <script src="https://live.zwidgets.com/js-sdk/1.0.5/ZohoEmbededAppSDK.min.js"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ===== BASE ===== */
      * {
        font-family: "Poppins", sans-serif;
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f5f6f8;
        padding: 16px;
      }

      /* ===== CONTAINER ===== */
      .container {
        max-width: 100%;
        margin: auto;
      }

      /* ===== HEADER ===== */
      .header {
        background: white;
        border-radius: 14px;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
      }

      /* ===== PROGRESS ===== */
      .progress-box {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .progress-circle {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: conic-gradient(
          #62ef69 var(--progress),
          #e3e6ea var(--progress)
        );
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
      }

      /* ===== PHASE ===== */
      .phase {
        font-size: 18px;
        font-weight: 500;
      }

      /* ===== TASK LIST PLACEHOLDER ===== */
      .tasks {
        margin-top: 20px;
        background: white;
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
      }

      /* ===== FOOTER ===== */
      .footer {
        margin-top: 16px;
        display: flex;
        justify-content: flex-end;
      }

      button {
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        background: #1f1f1f;
        color: white;
        cursor: pointer;
      }

      .task-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px;
        border-bottom: 1px solid #f0f0f0;
      }

      .task-name {
        font-size: 14px;
        font-weight: 500;
      }

      .task-right {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      select {
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid #ddd;
      }

      .task-row button {
        background: #43b548;
        padding: 6px 10px;
      }

      .toast {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #1f1f1f;
        color: white;
        padding: 12px 18px;
        border-radius: 8px;
        opacity: 0;
        transition: 0.3s;
        z-index: 9999;
      }

      .toast.show {
        opacity: 1;
      }

      .toast.error {
        background: #e53935;
      }

      .toast.success {
        background: #27a02d;
      }

      textarea {
        width: 100%;
        margin-top: 6px;
        padding: 6px;
        border-radius: 6px;
        border: 1px solid #ddd;
        font-size: 12px;
      }

      .phase-box {
        margin-bottom: 14px;
        border-radius: 12px;
        overflow: hidden;
        background: #f9fafb;
        border: 1px solid #ececec;
      }

      .phase-header {
        padding: 14px 16px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        background: white;
        border-radius: 12px;
      }

      .phase-header-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .phase-complete-btn {
        background: #43b548;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 12px;
        cursor: pointer;
      }

      .phase-complete-btn:hover {
        opacity: 0.9;
      }

      .phase-content {
        padding: 10px 10px 0 10px;
      }

      .arrow {
        font-size: 14px;
        color: #777;
      }

      .date-row {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }

      .date-row input {
        padding: 6px;
        border-radius: 6px;
        border: 1px solid #ddd;
        font-size: 12px;
      }

      .phase-content {
        display: none;
      }

      .phase-content.open {
        display: block;
      }

      .task-table {
        margin-top: 10px;
      }

      .table-header,
      .table-row {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 1fr 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 10px;
      }

      .table-row button {
        padding: 6px 12px;
        white-space: nowrap;
      }

      .table-header {
        font-weight: 600;
        font-size: 12px;
        color: #777;
        border-bottom: 1px solid #eee;
      }

      .table-row {
        border-bottom: 1px solid #f5f5f5;
      }

      .table-row input,
      .table-row select {
        padding: 6px;
        border-radius: 6px;
        border: 1px solid #ddd;
        font-size: 12px;
      }

      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      .modal-box {
        background: white;
        padding: 20px;
        border-radius: 12px;
        width: 350px;
        max-height: 500px;
        overflow: auto;
      }

      .check-item {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
        align-items: center;
      }

      .watermark {
        position: fixed;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);

        font-size: 10px;
        color: #aaa;
        opacity: 0.5;

        letter-spacing: 0.6px;
        font-weight: 400;

        pointer-events: none;
        user-select: none;
      }

      .watermark span {
        font-weight: 500;
        color: #666;
      }

      .info-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
        font-size: 10px;
        margin-left: 6px;
        border-radius: 50%;
        background: #e0e0e0;
        color: #333;
        cursor: default;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- HEADER -->
      <div class="header">
        <div class="progress-box">
          <div class="progress-circle" id="progressValue">0%</div>
          <div>
            <div style="font-size: 12px; color: #777">Current Phase</div>
            <div class="phase" id="phaseValue">-</div>
          </div>
        </div>
        <div
          id="companyBox"
          style="display: flex; align-items: center; gap: 10px"
        >
          <div
            id="welcomeText"
            style="font-size: 14px; font-weight: 500; color: #555"
          >
            Welcome <span id="companyName">...</span>
          </div>
          <div
            id="companyImagePlaceholder"
            style="
              width: 30px;
              height: 30px;
              border-radius: 50%;
              background: #e0e0e0;
            "
          ></div>
        </div>
      </div>

      <!-- TASK LIST -->
      <div class="tasks" id="taskContainer">Loading tasks...</div>

      <!-- FOOTER -->
      <div class="footer">
        <button onclick="saveTasks()">Save Changes</button>
      </div>
    </div>

    <script>
      function showToast(message, isError = false) {
        let toast = document.getElementById("toast");

        if (!toast) {
          toast = document.createElement("div");
          toast.id = "toast";
          document.body.appendChild(toast);
        }

        toast.innerText = message;
        toast.className = "toast show " + (isError ? "error" : "success");

        setTimeout(() => {
          toast.className = "toast";
        }, 3000);
      }

      let recordId = null;
      let recordData = null;

      /* ===== INIT ===== */
      window.addEventListener("load", function () {
        if (typeof ZOHO === "undefined") {
          console.error("ZOHO SDK not loaded");
          return;
        }

        ZOHO.embeddedApp.on("PageLoad", function (data) {
          // Ensure ID is a string and not an array
          recordId = Array.isArray(data.EntityId)
            ? data.EntityId[0]
            : data.EntityId;

          // Only call if recordId exists
          if (recordId) {
            loadRecord(data.Entity);
          }
        });

        ZOHO.embeddedApp.init();
      });

      /* ===== LOAD RECORD ===== */
      function loadRecord(entity) {
        ZOHO.CRM.API.getRecord({
          Entity: entity,
          RecordID: recordId,
        }).then(function (res) {
          if (!res || !res.data || res.data.length === 0) {
            document.getElementById("taskContainer").innerText =
              "No data found";
            return;
          }

          recordData = res.data[0];
          window.recordData = recordData;
          // console.log("FULL RECORD DATA:", recordData);

          renderHeader();
          renderTasks();
          loadOrgDetails();
        });
      }

      function loadOrgDetails() {
        const companySpan = document.getElementById("companyName");

        // STEP 1 — Try org variable
        ZOHO.CRM.API.getOrgVariable("company_name")
          .then(function (res) {
            // console.log("ORG VAR RESPONSE:", res);

            let name = res?.Success?.Content;

            if (name) {
              companySpan.innerText = name;
            } else {
              fallbackToUser();
            }
          })
          .catch(function () {
            fallbackToUser();
          });

        // STEP 2 — fallback (always works)
        function fallbackToUser() {
          ZOHO.CRM.CONFIG.getCurrentUser()
            .then(function (res) {
              // console.log("USER DATA:", res);

              let email = res?.users?.[0]?.email || "";

              if (email.includes("@")) {
                let domain = email.split("@")[1];
                let company = domain.split(".")[0];

                // Beautify
                company = company.replace(/[^a-zA-Z]/g, "");
                company = company.charAt(0).toUpperCase() + company.slice(1);

                companySpan.innerText = company;
              } else {
                companySpan.innerText = "Your Company";
              }
            })
            .catch(function () {
              companySpan.innerText = "Your Company";
            });
        }
      }

      /* ===== HEADER RENDER ===== */
      function renderHeader() {
        const progress = recordData.Progress || 0;

        const circle = document.getElementById("progressValue");
        const currentPhase =
          recordData.Acquisition_Type === "House & Land"
            ? recordData.Acquisition_Phase
            : recordData.Phase;

        document.getElementById("phaseValue").innerText = currentPhase || "-";
        circle.innerText = progress + "%";
        circle.style.setProperty("--progress", progress + "%");
      }

      /* ===== TASK RENDER (TEMP PLACEHOLDER) ===== */
      function renderTasks() {
        const container = document.getElementById("taskContainer");
        const tasks = recordData.Tasklists;
        console.log("Acquisition Type:", recordData.Acquisition_Type);
        console.log("Phase:", recordData.Phase);
        console.log("Acquisition Phase:", recordData.Acquisition_Phase);
        console.log("TASKLIST RAW:", tasks);
        if (!tasks || tasks.length === 0) {
          container.innerHTML = "No tasks found";
          return;
        }

        // Phase order (must match your system)
        const phases =
          recordData.Acquisition_Type === "House & Land"
            ? [
                "Property Brief",
                "Location Selection",
                "Sourcing",
                "Due Diligence",
                "Settlement & Handover",
                "Build Kickoff",
                "Slab Poured",
                "Frame Complete",
                "Roof / External Wall Complete",
                "Lockup Stage Complete",
                "Complete Handover",
              ]
            : [
                "Property Brief",
                "Location Selection",
                "Sourcing",
                "Due Diligence",
                "Settlement & Handover",
              ];

        let grouped = {};
        phases.forEach((p) => (grouped[p] = []));

        let currentPhase = null;

        // STEP 1: Group tasks based on headings
        tasks.forEach((row, index) => {
          const name = row.Task_Name || row.Task_Name1 || "";

          if (!name) {
            console.warn("Missing Task_Name field:", row);
            return;
          }

          // Detect heading rows
          // Detect heading rows (supports ===, ---, ▶▶▶)
          if (
            name.includes("===") ||
            name.includes("---") ||
            name.includes("▶")
          ) {
            currentPhase = name
              .replace(/=+/g, "")
              .replace(/-+/g, "")
              .replace(/▶+/g, "") // 🔥 handles ▶▶▶
              .trim()
              .toLowerCase();

            // console.log("Detected Phase Heading:", currentPhase);

            return;
          }

          const matchedPhase = phases.find((p) =>
            currentPhase.includes(p.toLowerCase())
          );

          if (matchedPhase) {
            grouped[matchedPhase].push({ ...row, index });
          } else {
            console.warn("No phase match → forcing into first phase:", name);
            grouped[phases[0]].push({ ...row, index });
          }
        });

        // STEP 2: Render accordion
        let html = "";

        const activePhase =
          recordData.Acquisition_Type === "House & Land"
            ? recordData.Acquisition_Phase || ""
            : recordData.Phase || "";

        phases.forEach((phase, i) => {
          const phaseTasks = grouped[phase];

          const incompleteTasks = phaseTasks.filter(
            (t) => t.Status !== "Completed"
          );

          const showPhaseButton =
            phaseTasks.length > 0 && incompleteTasks.length > 0;
          let extractedPhase = "";

          if (activePhase && activePhase.includes(":")) {
            extractedPhase = activePhase.split(":")[1].trim();
          } else {
            extractedPhase = activePhase;
          }

          const isOpen = extractedPhase.toLowerCase() === phase.toLowerCase(); // current phase open

          html += `
<div class="phase-box">

    <div
    class="phase-header"
    onclick="togglePhase('${phase}')"
>

        <span>
            ${i + 1}. ${phase}
        </span>

        <div class="phase-header-right">

            ${
              showPhaseButton
                ? `
               <button
    class="phase-complete-btn"
    onclick="event.stopPropagation(); openPhaseCompleteModal('${phase}')"
>
    Finish Phase
</button>
                `
                : ""
            }

            <span class="arrow">
                ${isOpen ? "▲" : "▼"}
            </span>

        </div>

    </div>

    <div class="phase-content ${
      isOpen ? "open" : ""
    }" id="phase-${phase.replace(/[^a-zA-Z0-9]/g, "")}">
`;
          html += `
<div class="task-table">

    <div class="table-header">
        <div>Task</div>
        <div>Status</div>
        <div>Priority</div>
        <div>Start</div>
        <div>Due</div>
        <div>✔</div>
    </div>
`;
          grouped[phase].forEach((task) => {
            html += `
<div class="table-row">

    <div class="task-name">
    ${task.Task_Name}
    ${
      task.Description
        ? `<span class="info-icon" title="${task.Description.replace(
            /"/g,
            "&quot;"
          )}">i</span>`
        : ""
    }
</div>

    <select onchange="updateStatus(${task.index}, this.value)">
        <option ${task.Status === "Open" ? "selected" : ""}>Open</option>
        <option ${
          task.Status === "In Progress" ? "selected" : ""
        }>In Progress</option>
        <option ${task.Status === "On Hold" ? "selected" : ""}>On Hold</option>
        <option ${
          task.Status === "Escalate" ? "selected" : ""
        }>Escalate</option>
        <option ${task.Status === "Delayed" ? "selected" : ""}>Delayed</option>
        <option ${
          task.Status === "Completed" ? "selected" : ""
        }>Completed</option>
    </select>

    <select onchange="updateField(${task.index}, 'Priority', this.value)">
        <option ${task.Priority === "None" ? "selected" : ""}>None</option>
        <option ${task.Priority === "Low" ? "selected" : ""}>Low</option>
        <option ${task.Priority === "Normal" ? "selected" : ""}>Normal</option>
        <option ${task.Priority === "High" ? "selected" : ""}>High</option>
    </select>

    <input type="date"
    value="${task.Start_Date || ""}"
    onchange="updateField(${
      task.index
    }, 'Start_Date', this.value); handleDateChange(${task.index})"
/>

    <input type="date"
    value="${task.Due_Date || ""}"
    onchange="updateField(${
      task.index
    }, 'Due_Date', this.value); handleDateChange(${task.index})"
/>

    ${
      task.Task_Name === "Property Shortlisted for Offer"
        ? `<button onclick="openComparableSales(${task.index})">
        Comparable Sales
        </button>`
        : `<button onclick="openChecklist(${task.index})">
        Checklist
        </button>`
    }

</div>
`;
          });

          html += `
</div> <!-- task-table -->
</div> <!-- phase-content -->
</div> <!-- phase-box -->
`;
        });

        container.innerHTML = html;
      }

      function togglePhase(phase) {
        const safePhase = phase.replace(/[^a-zA-Z0-9]/g, "");
        const content = document.getElementById("phase-" + safePhase);

        if (!content) return;

        const isOpen = content.classList.contains("open");

        // CLOSE ALL FIRST
        document.querySelectorAll(".phase-content").forEach((el) => {
          el.classList.remove("open");
        });

        document.querySelectorAll(".arrow").forEach((a) => {
          a.innerText = "▼";
        });

        //  OPEN ONLY IF IT WAS CLOSED
        if (!isOpen) {
          content.classList.add("open");

          const header = content.previousElementSibling;
          const arrow = header.querySelector(".arrow");
          if (arrow) arrow.innerText = "▲";
        }
      }

      function updateStatus(index, value) {
        recordData.Tasklists[index].Status = value;
      }

      function markComplete(index) {
        recordData.Tasklists[index].Status = "Completed";
        renderTasks(); // refresh UI
      }

      function saveTasks() {
        const tasks = recordData.Tasklists;

        if (!tasks || tasks.length === 0) {
          showToast("No tasks to update", true);
          return;
        }

        // Map the rows
        let updatedRows = tasks.map((row) => {
          let cleanObj = {
            id: String(row.id),
            Task_Name: row.Task_Name,
          };

          const isHeading =
            row.Task_Name &&
            (row.Task_Name.includes("===") || row.Task_Name.includes("---"));

          if (isHeading) {
            return cleanObj;
          }

          // ALWAYS send full structure for subform rows
          cleanObj.Status = row.Status || "Open";
          cleanObj.Priority = row.Priority || "Normal";

          //  IMPORTANT: Always send Checklist (even if empty string)
          cleanObj.Checklist = row.Checklist || "";

          // Optional fields
          if (row.Start_Date) cleanObj.Start_Date = row.Start_Date;
          if (row.Due_Date) cleanObj.Due_Date = row.Due_Date;
          if (row.Description !== undefined)
            cleanObj.Description = row.Description || "";

          return cleanObj;
        });

        // CONSTRUCTION CHECK:
        // The "id" inside the data array is the Acquisition Record ID.
        // The "id" inside Tasklists is the Subform Row ID.
        const config = {
          Entity: "Acquisitions",
          APIData: {
            id: recordId.toString(),
            Tasklists: updatedRows,

            B_P_Completion_In_Days: recordData.B_P_Completion_In_Days,
            B_P_Completion_Due_Date: recordData.B_P_Completion_Due_Date,

            Finance_Approval_In_Days: recordData.Finance_Approval_In_Days,
            Finance_Approval_Due_Date: recordData.Finance_Approval_Due_Date,

            Settlement_In_Days: recordData.Settlement_In_Days,
            Settlement_Due_Date: recordData.Settlement_Due_Date,
          },
          Trigger: ["workflow"], // Optional: triggers workflows if needed
        };

        // console.log("FINAL ATTEMPT CONFIG:", config);
        //     console.log("CHECKLIST FIELD:", updatedRows.map(r => ({
        //     id: r.id,
        //     checklist: r.Checklist
        // })));

        ZOHO.CRM.API.updateRecord(config)
          .then(function (res) {
            // Zoho Sandbox sometimes returns the result inside an array, sometimes not
            const result = Array.isArray(res.data) ? res.data[0] : res;

            if (result.code === "SUCCESS" || result.status === "success") {
              showToast("Tasks updated successfully. Refresh Page.");
              setTimeout(() => {
                const currentPhase =
                  recordData.Acquisition_Type === "House & Land"
                    ? recordData.Acquisition_Phase
                    : recordData.Phase;

                localStorage.setItem("openPhase", currentPhase || "");
                location.reload();
              }, 800);
            } else {
              console.error("Detailed API Error:", result);
              showToast("Error: " + (result.message || "Check Console"), true);
            }
          })
          .catch(function (err) {
            console.error("Actual Error Object:", err);
            // This helper will drill into the error you saw earlier
            if (err.data && err.data[0]) {
              console.error("Zoho Specific Error:", err.data[0].details);
            }
            showToast("Update failed", true);
          });
      }

      function handleDateChange(index) {
        const task = recordData.Tasklists[index];

        if (!task.Start_Date || !task.Due_Date) return;

        const start = new Date(task.Start_Date);
        const due = new Date(task.Due_Date);

        if (isNaN(start) || isNaN(due)) return;

        const days = Math.ceil((due - start) / (1000 * 60 * 60 * 24));
        if (days < 0) return;

        const name = task.Task_Name;

        //  B&P (ONLY this task)
        if (name === "B&P Completed") {
          recordData.B_P_Completion_In_Days = days;
          recordData.B_P_Completion_Due_Date = task.Due_Date;
        }

        // Finance
        if (name === "Finance Approval") {
          recordData.Finance_Approval_In_Days = days;
          recordData.Finance_Approval_Due_Date = task.Due_Date;
        }

        // Settlement (2 tasks)
        if (
          name === "Conveyancer Settlement Confirmation" ||
          name === "Confirm Settlement Completion"
        ) {
          recordData.Settlement_In_Days = days;
          recordData.Settlement_Due_Date = task.Due_Date;
        }

        console.log("Mapped Task:", name, "Days:", days);
      }

      function updateField(index, field, value) {
        recordData.Tasklists[index][field] = value;
      }

      // ===== CHECKLIST LOGIC =====

      let checklistState = {};

      // Parse text → array
      function parseChecklist(text) {
        if (!text || typeof text !== "string") return [];

        return text
          .replace(/\r/g, "") // handle Windows line breaks
          .split("\n")
          .map((line) => line.trim())
          .filter((line) => line.length > 0)
          .map((line) => {
            const match = line.match(/(.*)\[(.*)\]/);

            if (match) {
              return {
                label: match[1].trim(),
                status: match[2].trim(),
              };
            }

            return {
              label: line,
              status: "Not Done",
            };
          });
      }
      // Build array → text
      function buildChecklistText(items) {
        return items.map((item) => `${item.label} [${item.status}]`).join("\n");
      }

      // Open popup
      function openChecklist(index) {
        const raw = recordData.Tasklists[index].Checklist;
        const items = parseChecklist(raw);

        checklistState[index] = items;

        let html = `
    <div class="modal-overlay">
        <div class="modal-box">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="margin:0;">Checklist</h3>
        <span style="cursor:pointer; font-size:18px;" onclick="closeChecklist()">✖</span>
    </div>
    `;

        if (items.length === 0) {
          html += `<p style="color:#777;">No checklists found</p>`;
        } else {
          items.forEach((item, i) => {
            html += `
        <div class="check-item">
            <input type="checkbox"
                ${item.status.toLowerCase() === "done" ? "checked" : ""}
                onchange="updateChecklistItem(${index}, ${i}, this.checked)"
            />
            <span>${item.label}</span>
        </div>
        `;
          });
        }

        html += `
            <button onclick="saveChecklist(${index})">Done</button>
        </div>
    </div>
    `;

        document.body.insertAdjacentHTML("beforeend", html);
        // console.log("RAW CHECKLIST:", raw);
      }

      // Update checkbox state
      function updateChecklistItem(taskIndex, itemIndex, checked) {
        checklistState[taskIndex][itemIndex].status = checked
          ? "Done"
          : "Not Done";
      }

      // Save checklist back to Notes
      function saveChecklist(index) {
        const items = checklistState[index];
        if (!items) return;

        const text = buildChecklistText(items);

        recordData.Tasklists[index].Checklist = text;

        document.querySelector(".modal-overlay").remove();
      }

      function closeChecklist() {
        const modal = document.querySelector(".modal-overlay");

        if (modal) {
          modal.remove();
        }
      }

      function confirmPhaseCompletion(phaseName) {
        closePhaseCompleteModal();

        const tasks = recordData.Tasklists;

        let currentPhase = "";

        tasks.forEach((row) => {
          const name = row.Task_Name || "";

          if (name.includes("▶")) {
            currentPhase = name.replace(/▶+/g, "").trim().toLowerCase();

            return;
          }

          if (currentPhase === phaseName.toLowerCase()) {
            if (row.Status !== "Completed") {
              row.Status = "Completed";
            }
          }
        });

        renderTasks();

        showToast(phaseName + " tasks marked as completed.");

        saveTasks();

          // =============================================

          // GET CURRENT CRM USER

        padding:20px;

        color:#555;

`;

<br>
${p.bedrooms}b | ${p.bathrooms}ba</td>

">

</div>

        } catch (error) {

          let errorMessage =
            "Unknown error. please contact support@agenttime.au.";

          // Zoho SDK errors
          if (error.message) {
            errorMessage = error.message;

      // =============================================
      // SAVE NOTES
      // =============================================

      async function saveComparableSalesNotes(encodedText) {
        try {
          const notesText = decodeURIComponent(encodedText);

          if (!notesText || notesText.trim() === "") {
            showToast(
              "No comparable sales data to save. Try again later.",
              true
            );

            return;
          }

          // ---------------------------------------------
          // CREATE ZOHO NOTE RELATED LIST
          // ---------------------------------------------

          await ZOHO.CRM.API.insertRecord({
            Entity: "Notes",

            APIData: {
              Note_Title: "Comparable Sales Evidence",

              Note_Content: notesText,

              Parent_Id: recordId,

              se_module: "Acquisitions",
            },

            Trigger: ["workflow"],
          });

          // ---------------------------------------------
          // CREATE PROPERTY NOTE
          // ---------------------------------------------

          await ZOHO.CRM.API.insertRecord({
            Entity: "Notes",

            APIData: {
              Note_Title: "Comparable Sales Evidence",

              Note_Content: notesText,

              Parent_Id: window.currentInterestedPropertyId,

              se_module: "Properties",
            },

            Trigger: ["workflow"],
          });

          showToast("Comparable sales added to Notes successfully.");

          closeComparableSales();
        } catch (error) {
          console.error(error);

          showToast(
            "Failed to save comparable sales notes. please contact support@agenttime.au.",
            true
          );
        }
      }

      async function updateHTagSenderRecord(creditData) {
        try {
          const senderSearch = await ZOHO.CRM.API.searchRecord({
            Entity: "Sender_IDs",
            Type: "criteria",
            Query: "(Sender_Type:equals:HTag)",
          });

          if (!senderSearch.data || senderSearch.data.length === 0) {
            console.log("HTag Sender_ID not found");
            return;
          }

          const senderId = senderSearch.data[0].id;

          const zohoDateTime =
            new Date().toISOString().split(".")[0] + "+00:00";

          console.log("DATETIME:", zohoDateTime);

          const lastTopUpDate = creditData.last_topup_date
            ? new Date(creditData.last_topup_date.replace(" ", "T"))
                .toISOString()
                .split(".")[0] + "+00:00"
            : null;

          const config = {
            Entity: "Sender_IDs",
            APIData: {
              id: senderId,

              Last_Credit_Usage_Date: zohoDateTime,

              Available_Credits: creditData.available_credits,

              Last_Credits_Consumed: creditData.last_credits_consumed,

              Credit_Status: creditData.credit_status,

              Last_Top_Up: creditData.last_topup,

              Last_Top_Up_Date: lastTopUpDate,

              Total_Credits_Purchased: creditData.total_credits_purchased,
            },
          };

          console.log(
            "TOTAL_CREDITS_PURCHASED SENT:",
            creditData.total_credits_purchased
          );

          console.log("SENDER UPDATE CONFIG:", config);

          const updateResponse = await ZOHO.CRM.API.updateRecord(config);

          console.log("SENDER UPDATE RESPONSE:", updateResponse);

          const verify = await ZOHO.CRM.API.getRecord({
            Entity: "Sender_IDs",
            RecordID: senderId,
          });
        } catch (error) {
          console.error(
            "SENDER UPDATE ERROR FULL:",
            JSON.stringify(error, null, 2)
          );

          console.error("SENDER UPDATE ERROR RAW:", error);
        }
      }

      function closeComparableSales() {
        const modal = document.querySelector(".modal-overlay");

        if (modal) {
          modal.remove();
        }
